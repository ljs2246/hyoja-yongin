name: 병원·약국 자료 자동 갱신
on:
  schedule:
    - cron: "30 21 * * *"   # 매일 한국시간 오전 6시 30분
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_data.py"
      - ".github/workflows/update-data.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 자료 가져오기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 scripts/fetch_data.py
      - name: 바뀐 자료 저장
        if: always()
        run: |
          git config user.name "자동 갱신"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "자동 갱신: 병원·약국 자료" && git pull --rebase -q && git push)
