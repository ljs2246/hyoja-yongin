name: 병원 방문 도우미 QA (시험 브랜치)
on:
  push:
    branches:
      - 'test/visit-helper-privacy-pete-20261030'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visit-helper-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 모의 브라우저 준비
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: 기존 병원 방문 도우미 모의시험
        run: python experiments/visit-helper/tests-visit.py
      - name: 방문기록·사진·알림 삭제 모의시험 15건
        run: python experiments/visit-helper/tests-privacy.py
