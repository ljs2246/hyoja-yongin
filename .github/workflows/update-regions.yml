name: 전국 지역코드 원본 수집·검사
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1이면 아무것도 올리지 않고 예정만 출력(시험용)'
        default: '1'
permissions:
  contents: write        # 갱신 브랜치(auto/regions-*)에만 push
  pull-requests: write
  actions: write         # 필수 검사 qa 실행 요청
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 수집기 검사
        run: python3 -m unittest discover -s scripts -p test_fetch_regions.py -v
      - name: 공식 지역 원본 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 scripts/fetch_regions.py
      - name: "결과 기록 (PR 방식, main 직접 push 없음, 시험용 dry_run 기본 1)"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'schedule' && '0' || (inputs.dry_run || '1') }}
          PREFIX: auto/regions
          PATHS: data/regions-status.json data/regions-source.json
          CHECK: none
        run: bash scripts/auto-data-pr.sh
