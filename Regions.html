<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 가족 지역 선택 · 효자</title><link rel="stylesheet" href="theme.css"><style>

</style></head><body><main><a href="index.html">← 처음 화면</a><h1>부모님이 계신 곳에,<br>효자가 함께합니다.</h1><p>내 지역과 부모님 지역을 따로 골라 주세요.</p><div class="note"><strong>용인시 견본을 먼저 완성하고 있어요.</strong><br>현재 선택 가능한 지역은 용인시와 3개 구입니다. 용인 전체 검수를 마친 뒤 전국으로 확장할 예정입니다. 선택한 구는 병원·약국 검색에 적용되며, 나머지 메뉴는 현재 용인시 공통 안내입니다.</div>
<section class="card" aria-labelledby="mine-title"><h2 id="mine-title">내 지역</h2><p id="region-mine-name"></p><label for="region-mine-select">내가 살고 있는 지역</label><select id="region-mine-select"><option value="">지역을 골라 주세요</option></select><div class="actions"><button id="region-mine-save" class="primary">선택 저장</button><button id="region-mine-active" aria-pressed="true">내 지역 보기</button><button id="region-mine-clear">선택 지우기</button></div></section>
<section class="card" aria-labelledby="parents-title"><h2 id="parents-title">부모님 지역</h2><p id="region-parents-name"></p><label for="region-parents-select">부모님이 계신 지역</label><select id="region-parents-select"><option value="">지역을 골라 주세요</option></select><div class="actions"><button id="region-parents-save" class="primary">선택 저장</button><button id="region-parents-active" aria-pressed="false">부모님 지역 보기</button><button id="region-parents-clear">선택 지우기</button></div></section>
<p id="hj-region-summary" aria-live="polite"></p><a id="region-medical-link" class="go" hidden></a><p id="region-save-status" role="status"></p><p style="font-size:16px">지역 선택은 부모님의 실제 위치를 추적하지 않습니다. 지도 길찾기의 출발지는 지도 앱에서 별도로 확인해 주세요. 저장한 내용은 이 기기·브라우저에만 적용됩니다.</p>
